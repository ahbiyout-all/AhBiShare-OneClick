name: Build and Publish AhBiShare OneClick Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Windows Release Binaries
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Verify TypeScript & Release Guardrails
        run: |
          npm run lint
          npm run verify

      - name: Extract App Version
        shell: pwsh
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package Standard & Lite Portable EXEs (Versioned Only)
        run: npm run electron:build:all
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Windows 7/8/8.1 Portable EXE (Versioned Only)
        run: npm run electron:build:win7
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Windows Setup Installer (Versioned Only)
        shell: pwsh
        run: |
          $ver = $env:APP_VERSION
          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($iscc) {
            Write-Host "Building Inno Setup installer v$ver..."
            & $iscc "/DAppVersion=$ver" "installer\setup.iss"
          } else {
            Write-Host "ISCC.exe not found, building NSIS installer v$ver..."
            npx electron-builder --win nsis --x64
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect Strictly Version-Numbered Release Executables
        shell: pwsh
        run: |
          $ver = $env:APP_VERSION
          $stageDir = "release-github"
          if (Test-Path $stageDir) { Remove-Item $stageDir -Recurse -Force }
          New-Item -ItemType Directory -Path $stageDir | Out-Null

          Get-ChildItem -Path "release" -Filter "*_v${ver}*.exe" -File | ForEach-Object {
            Copy-Item $_.FullName -Destination (Join-Path $stageDir $_.Name) -Force
          }

          $collected = Get-ChildItem -Path $stageDir -File
          if ($collected.Count -eq 0) {
            throw "No version-numbered executables (*_v${ver}*.exe) were produced."
          }
          $collected | Format-Table Name, Length -AutoSize

      - name: Extract Release Notes
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const ver = process.env.APP_VERSION || '1.0.0';
            try {
              const txt = fs.readFileSync('docs/PATCH_NOTES.md', 'utf8');
              fs.writeFileSync('RELEASE_CHANGELOG.md', txt.trim());
            } catch (e) {
              fs.writeFileSync('RELEASE_CHANGELOG.md', 'AhBiShare OneClick Release v' + ver);
            }
          "

      - name: Publish Versioned EXE Assets to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.APP_VERSION) }}
          name: AhBiShare OneClick v${{ env.APP_VERSION }}
          body_path: RELEASE_CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            release-github/*_v*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
